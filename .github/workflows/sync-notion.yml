name: Scheduled Notion Sync

on:
  schedule:
    # Run every day at 02:00 UTC (12:00 AEST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-and-rebuild:
    name: Sync Notion → Rebuild → Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Sync Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKSPACE_ID: ${{ secrets.NOTION_WORKSPACE_ID }}
          NOTION_DB_PLATFORM:   ${{ vars.NOTION_DB_PLATFORM }}
          NOTION_DB_GOVERNANCE: ${{ vars.NOTION_DB_GOVERNANCE }}
          NOTION_DB_TECHNOLOGY: ${{ vars.NOTION_DB_TECHNOLOGY }}
          NOTION_DB_DEVELOPERS: ${{ vars.NOTION_DB_DEVELOPERS }}
          NOTION_DB_RESOURCES:  ${{ vars.NOTION_DB_RESOURCES }}
        run: npm run sync-notion

      - name: Commit updated content
        run: |
          git config user.name  "TenantSage Docs Bot"
          git config user.email "docs-bot@tenantsage.ai"
          git add content/
          git diff --staged --quiet || git commit -m "chore: sync Notion content [skip ci]"
          git push
